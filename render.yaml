services:
  - name: rent-a-car-php
    type: web
    runtime: docker
    plan: free
    region: oregon
    buildCommand: |
      docker build -t rent-a-car-php .
    startCommand: |
      docker run -p 10000:80 rent-a-car-php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        value: "sql.freedb.tech"
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "freedb_rent-a-car"
      - key: DB_USER
        value: "freedb_Asafrushiti"
      - key: DB_PASS
        value: "fQ@DpWv9ZG7aF#2"
